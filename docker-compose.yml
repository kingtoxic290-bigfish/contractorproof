services:
  postgres:
    image: postgres:16-alpine
    container_name: contractorproof-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: contractorproof
      POSTGRES_PASSWORD: contractorproof
      POSTGRES_DB: contractorproof
    ports:
      - "5433:5432"
    volumes:
      - contractorproof_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractorproof -d contractorproof"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  contractorproof_pgdata:
